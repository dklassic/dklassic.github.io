name: Generate BBCode from game docs

on:
  # Run whenever markdown content changes on master
  push:
    branches:
      - master
    paths:
      - "content/english/**/faq.md"
      - "content/english/**/tech-fixes.md"
      - "content/tchinese/**/faq.md"
      - "content/tchinese/**/tech-fixes.md"

  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  generate-bbcode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run BBCode conversion (English)
        run: |
          python .github/scripts/md_to_bbcode.py \
            content/english \
            bbcode/english

      - name: Run BBCode conversion (Traditional Chinese)
        run: |
          python .github/scripts/md_to_bbcode.py \
            content/tchinese \
            bbcode/tchinese

      - name: Check for changes
        id: diff
        run: |
          git add bbcode/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/bbcode-update
          delete-branch: true
          commit-message: "chore: regenerate BBCode from game docs"
          title: "[Auto] Update BBCode conversions for game docs"
          body: |
            This PR was automatically generated by the **Generate BBCode** workflow.

            It contains freshly converted BBCode versions of `faq.md` and `tech-fixes.md`
            for every game under `content/english/` and `content/tchinese/`.

            ### Changed files
            <!-- The workflow converts Markdown → BBCode and commits the result to bbcode/<game>/ -->
            See the **Files changed** tab for the full diff.

            ---
            *Triggered by a push to `master` that modified one or more game doc files.*
          labels: |
            automated
            bbcode
